name: Auto-Assign Issues

on:
  issues:
    types: [opened, labeled]

permissions:
  issues: write
  contents: read

jobs:
  assign-issue:
    name: Auto-Assign Issues by Label
    runs-on: ubuntu-latest

    steps:
      - name: Assign Issue Based on Labels
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const issue = context.payload.issue;
            const labelToAssignee = {
              'bug': ['maintainer1'],
              'feature': ['maintainer2'],
              'documentation': ['maintainer1', 'maintainer2'],
              'frontend': ['maintainer2'],
              'backend': ['maintainer1'],
              'ci-cd': ['maintainer1'],
              'security': ['maintainer1']
            };
            const labels = issue.labels.map(l => l.name);
            const assignees = new Set();
            labels.forEach(label => {
              const lc = label.toLowerCase();
              if (labelToAssignee[lc]) {
                labelToAssignee[lc].forEach(a => assignees.add(a));
              }
            });
            if (labels.some(l => l.toLowerCase() === 'bug')) {
              assignees.add(issue.user.login);
            }
            if (assignees.size > 0) {
              try {
                await github.rest.issues.addAssignees({
                  owner,
                  repo,
                  issue_number: issue.number,
                  assignees: Array.from(assignees)
                });
              } catch (error) {
                console.log(`Error: ${error.message}`);
              }
            }

      - name: Add Priority Based on Issue Type
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const issue = context.payload.issue;
            const labels = issue.labels.map(l => l.name);
            let priority = '';
            if (labels.includes('security')) {
              priority = 'priority-critical';
            } else if (labels.includes('bug')) {
              priority = 'priority-high';
            } else if (labels.includes('feature')) {
              priority = 'priority-medium';
            } else if (labels.includes('documentation')) {
              priority = 'priority-low';
            }
            if (priority && !labels.includes(priority)) {
              try {
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: issue.number,
                  labels: [priority]
                });
              } catch (error) {
                console.log(`Error: ${error.message}`);
              }
            }

      - name: Post Auto-Assignment Comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const issue = context.payload.issue;
            if (context.payload.action !== 'opened') return;
            const labels = issue.labels.map(l => l.name);
            let type = '📋 Issue';
            if (labels.includes('bug')) type = '🐛 Bug';
            else if (labels.includes('feature')) type = '✨ Feature';
            const msg = `## Auto-Assignment Complete\n\n` +
              `**Type:** ${type}`;
            try {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issue.number,
                body: msg
              });
            } catch (error) {
              console.log(`Error: ${error.message}`);
            }
