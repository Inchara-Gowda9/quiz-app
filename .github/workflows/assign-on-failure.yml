name: Auto-Assign on Pipeline Failure

on:
  workflow_run:
    workflows: ["CI/CD Pipeline"]
    types: [completed]

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  assign-on-failure:
    name: Auto-Assign on CI Failure
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'failure'

    steps:
      - name: Get Workflow Information
        id: workflow-info
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const workflow = context.payload.workflow_run;
            core.setOutput('head-commit', workflow.head_sha);
            core.setOutput('head-branch', workflow.head_branch);
            core.setOutput('conclusion', workflow.conclusion);

      - name: Find Associated Pull Request
        id: find-pr
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const headBranch =
              '${{ steps.workflow-info.outputs.head-branch }}';
            try {
              const { data: prs } = await github.rest.pulls.list({
                owner,
                repo,
                state: 'open',
                head: `${owner}:${headBranch}`
              });
              if (prs.length > 0) {
                const pr = prs[0];
                core.setOutput('pr-number', pr.number);
                core.setOutput('pr-author', pr.user.login);
              }
            } catch (error) {
              console.log(`Error: ${error.message}`);
            }

      - name: Assign Failed PR to Author
        if: steps.find-pr.outputs.pr-number
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const prNumber =
              parseInt('${{ steps.find-pr.outputs.pr-number }}');
            const prAuthor =
              '${{ steps.find-pr.outputs.pr-author }}';
            try {
              await github.rest.issues.addAssignees({
                owner,
                repo,
                issue_number: prNumber,
                assignees: [prAuthor]
              });
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: prNumber,
                labels: ['ci-failed', 'requires-attention']
              });
            } catch (error) {
              console.log(`Error: ${error.message}`);
            }

      - name: Post Failure Comment on PR
        if: steps.find-pr.outputs.pr-number
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const prNumber =
              parseInt('${{ steps.find-pr.outputs.pr-number }}');
            const msg = `## CI Pipeline Failed\n\n` +
              `Please review logs and fix issues.\n\n` +
              `Run: npm install && npm test`;
            try {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body: msg
              });
            } catch (error) {
              console.log(`Error: ${error.message}`);
            }

